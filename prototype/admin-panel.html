<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xodim Aloqalar Xaritasi — Nazorat paneli</title>
<!-- Tashqi bog'liqlik yo'q: yopiq (internetsiz) tarmoqda ham ishlaydi -->
<style>
/* ============================================================
   DESIGN TOKENS (Garant panellari bilan bir xil tizim)
   ============================================================ */
:root{
  --bg:#F5F6F9;
  --surface:#FFFFFF;
  --surface-alt:#FAFBFC;
  --border:#E2E5EC;
  --border-strong:#CBD2DE;
  --text-1:#0F1522;
  --text-2:#4B5468;
  --text-3:#8A93A3;
  --blue:#2C4CE0;
  --blue-dark:#1E37AE;
  --blue-bg:#EAEEFC;
  --green:#157A4A;
  --green-bg:#E4F5EC;
  --red:#B3261E;
  --red-bg:#FCEAE9;
  --amber:#A15C00;
  --amber-bg:#FCEFDD;
  --purple:#6339B8;
  --purple-bg:#F0EBFB;
  --navy-1:#0B1220;
  --navy-2:#121B2E;
  --navy-3:#1B2740;
  --navy-text:#C9D2E3;
  --navy-text-dim:#7C8AA6;
  --emp:#2B4C8C;
  --radius-lg:10px;
  --radius-md:7px;
  --radius-sm:4px;
  --shadow-sm:0 1px 2px rgba(15,21,34,0.06);
  --shadow-md:0 4px 16px rgba(15,21,34,0.10);
  --shadow-lg:0 12px 40px rgba(15,21,34,0.16);
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text-1);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text-1);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#CBD2DE;border-radius:8px;}
a{color:var(--blue);text-decoration:none;}
a:hover{text-decoration:underline;}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}
.mono{font-family:var(--mono);}
.tabular{font-variant-numeric:tabular-nums;}
.muted{color:var(--text-3);}
.dim{color:var(--text-2);}
.nowrap{white-space:nowrap;}
svg.i{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* ============================================================
   APP SHELL
   ============================================================ */
.app-shell{display:flex;height:100vh;width:100vw;}
.sidebar{width:244px;min-width:244px;background:var(--navy-1);color:var(--navy-text);display:flex;flex-direction:column;transition:width .18s,min-width .18s;overflow:hidden;z-index:40;}
.sidebar.collapsed{width:64px;min-width:64px;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap;}
.sidebar-brand .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(160deg,#3E63FF,#2C4CE0);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
.sidebar-brand .name{font-weight:700;color:#fff;font-size:14px;}
.sidebar-brand .sub{font-size:10.5px;color:var(--navy-text-dim);margin-top:1px;}
.sidebar.collapsed .brand-text{display:none;}
.sidebar-scroll{flex:1;overflow-y:auto;padding:6px 10px 12px;}
.nav-section-label{font-size:10.5px;color:var(--navy-text-dim);padding:14px 10px 6px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.sidebar.collapsed .nav-section-label{display:none;}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--radius-md);color:var(--navy-text);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:1px;position:relative;white-space:nowrap;border:none;background:transparent;width:100%;text-align:left;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(46,86,255,.18);color:#fff;}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:6px;bottom:6px;width:3px;background:#4C6CFF;border-radius:0 3px 3px 0;}
.nav-item.locked{opacity:.38;}
.nav-item .badge{margin-left:auto;background:rgba(255,255,255,.1);color:var(--navy-text);font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:600;}
.nav-item .badge.danger{background:var(--red);color:#fff;}
.sidebar.collapsed .nav-item .label,.sidebar.collapsed .nav-item .badge{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;}
.sidebar-footer{border-top:1px solid rgba(255,255,255,.07);padding:10px;}
.sidebar-footer .nav-item{color:var(--navy-text-dim);font-size:12.5px;}
.main-col{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;}
.topbar{height:56px;min-height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 18px;z-index:30;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-md);padding:7px 11px;width:340px;color:var(--text-3);position:relative;}
.search-box:focus-within{border-color:var(--blue);background:var(--surface);}
.search-box input{border:none;outline:none;background:transparent;width:100%;}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);max-height:340px;overflow:auto;display:none;z-index:60;}
.search-results.open{display:block;}
.search-results .sr{display:flex;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;color:var(--text-1);}
.search-results .sr:hover,.search-results .sr.hl{background:var(--blue-bg);}
.search-results .sr .k{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.3px;margin-left:auto;}
.topbar .spacer{flex:1;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.pill.sample{background:var(--amber-bg);color:var(--amber);border:1px dashed #D9A55A;font-family:var(--mono);letter-spacing:.5px;font-size:10.5px;}
.pill.date{background:var(--surface-alt);border:1px solid var(--border);color:var(--text-2);}
.icon-btn{width:36px;height:36px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-2);position:relative;}
.icon-btn:hover{background:var(--surface-alt);color:var(--text-1);}
.icon-btn .dot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.user-chip{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border:1px solid var(--border);border-radius:24px;background:var(--surface);cursor:pointer;position:relative;}
.user-chip .av{width:28px;height:28px;border-radius:50%;background:var(--navy-3);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.user-chip .nm{font-size:12.5px;font-weight:600;line-height:1.15;}
.user-chip .rl{font-size:10.5px;color:var(--text-3);}
.dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);min-width:300px;z-index:70;display:none;padding:6px;}
.dropdown.open{display:block;}
.dropdown .dd-h{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;font-weight:600;padding:8px 10px 6px;}
.dropdown .dd-i{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--radius-md);cursor:pointer;}
.dropdown .dd-i:hover{background:var(--surface-alt);}
.dropdown .dd-i.on{background:var(--blue-bg);}
.dropdown .dd-i .t{font-weight:600;font-size:12.5px;}
.dropdown .dd-i .s{font-size:11.5px;color:var(--text-3);}
.content{flex:1;overflow:auto;padding:22px 26px 40px;}
.content.full{padding:0;overflow:hidden;display:flex;flex-direction:column;}

/* ============================================================
   COMMON UI
   ============================================================ */
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.page-head h1{font-size:21px;margin:0 0 3px;letter-spacing:-.2px;}
.page-head .sub{color:var(--text-2);font-size:13px;max-width:760px;}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.crumbs{font-size:12px;color:var(--text-3);margin-bottom:6px;}
.crumbs a{color:var(--text-3);}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--surface);color:var(--text-1);font-size:12.5px;font-weight:600;white-space:nowrap;}
.btn:hover{background:var(--surface-alt);}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn.primary:hover{background:var(--blue-dark);}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2);}
.btn.ghost:hover{background:var(--surface-alt);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn svg.i{width:14px;height:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);}
.card-h h3{margin:0;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-2);font-weight:700;}
.card-h .cnt{margin-left:auto;font-family:var(--mono);color:var(--text-3);font-size:12px;}
.card-b{padding:14px 16px;}
.card-b.flush{padding:0;}
.grid{display:grid;gap:16px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);}
.mt{margin-top:16px;}
.kpi-strip{background:var(--navy-1);border-radius:var(--radius-lg);display:grid;grid-template-columns:repeat(6,1fr);color:#fff;margin-bottom:16px;overflow:hidden;}
.kpi{padding:15px 18px;border-right:1px solid rgba(255,255,255,.07);cursor:pointer;}
.kpi:last-child{border-right:none;}
.kpi:hover{background:rgba(255,255,255,.04);}
.kpi .l{font-size:11px;color:var(--navy-text-dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:4px;}
.kpi .v.red{color:#FF8A80;}
.kpi .v.amber{color:#FFC46B;}
.kpi .h{font-size:11px;color:var(--navy-text-dim);margin-top:2px;}
table.t{width:100%;border-collapse:collapse;}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface-alt);white-space:nowrap;position:sticky;top:0;z-index:1;}
table.t td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
table.t tr:last-child td{border-bottom:none;}
table.t tr.click{cursor:pointer;}
table.t tr.click:hover td{background:#F7F9FD;}
table.t td.num,table.t th.num{text-align:right;}
.fio{font-weight:600;}
.sub2{font-size:11.5px;color:var(--text-3);}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.b-red{background:var(--red-bg);color:var(--red);}
.b-amber{background:var(--amber-bg);color:var(--amber);}
.b-green{background:var(--green-bg);color:var(--green);}
.b-blue{background:var(--blue-bg);color:var(--blue);}
.b-gray{background:#EEF0F4;color:var(--text-2);}
.b-purple{background:var(--purple-bg);color:var(--purple);}
.b-outline{border:1px dashed var(--border-strong);color:var(--text-2);}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:42px;font-family:var(--mono);font-weight:600;font-size:13.5px;padding:3px 8px;border-radius:6px;}
.score.yuqori{background:var(--red-bg);color:var(--red);}
.score.orta{background:var(--amber-bg);color:var(--amber);}
.score.past{background:var(--green-bg);color:var(--green);}
.lvl-bar{position:relative;height:8px;border-radius:5px;background:linear-gradient(90deg,#5E8C61 0 25%,#B5894A 25% 56%,#A8473B 56% 100%);}
.lvl-bar .mk{position:absolute;top:-4px;width:4px;height:16px;background:var(--text-1);border-radius:2px;transform:translateX(-2px);}
.mini-bar{height:6px;border-radius:4px;background:#EEF0F4;overflow:hidden;width:90px;}
.mini-bar>i{display:block;height:100%;border-radius:4px;}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-md);overflow:hidden;background:var(--surface);}
.seg button{border:none;background:transparent;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--text-2);border-right:1px solid var(--border);}
.seg button:last-child{border-right:none;}
.seg button.on{background:var(--emp);color:#fff;}
.chip-filter{display:inline-flex;gap:6px;flex-wrap:wrap;}
.chip-filter button{border:1px solid var(--border-strong);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:12.5px;color:var(--text-1);}
.chip-filter button.on{background:var(--text-1);border-color:var(--text-1);color:#fff;}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.input,.select,textarea.input{border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:8px 10px;background:var(--surface);min-width:0;}
.input:focus,.select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg);}
.input.err{border-color:var(--red);}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:var(--radius-md);font-size:12.5px;margin-bottom:12px;}
.notice.info{background:var(--blue-bg);color:#22378F;}
.notice.warn{background:var(--amber-bg);color:#7A4600;}
.notice.danger{background:var(--red-bg);color:#8C1D17;}
.notice.ok{background:var(--green-bg);color:#0F5C37;}
.notice svg.i{margin-top:1px;}
.empty{padding:28px;text-align:center;color:var(--text-3);}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tabs button{border:none;background:transparent;padding:10px 14px;font-size:13px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);}
.tabs button .n{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-left:4px;}
.tag-new{font-size:9.5px;font-weight:700;letter-spacing:.4px;background:var(--purple-bg);color:var(--purple);padding:1px 6px;border-radius:4px;text-transform:uppercase;vertical-align:middle;}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:12.5px;}
.kv .k{color:var(--text-3);}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}

/* ---------- employee row ---------- */
.emp-cell{display:flex;gap:10px;align-items:center;}
.avatar{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--emp);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-1);flex-shrink:0;}
.avatar.yuqori{border-color:var(--red);}
.avatar.orta{border-color:#C08A3E;}
.avatar.past{border-color:var(--green);}
.avatar.lg{width:58px;height:58px;font-size:17px;border-width:4px;}
.avatar.locked{border-color:var(--border-strong);color:var(--text-3);}

/* ---------- profile ---------- */
.profile-head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:16px;}
.ph-id{display:flex;gap:14px;align-items:center;}
.ph-id h2{margin:2px 0;font-size:20px;}
.big-score{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1;}
.big-score small{font-size:16px;color:var(--text-3);}
.reasons{margin:12px 0 0;padding-left:18px;color:var(--text-2);}
.reasons li{margin-bottom:3px;}
.timeline{display:flex;flex-direction:column;gap:10px;}
.tl-item{border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;background:var(--surface-alt);}
.tl-item .top{display:flex;gap:10px;align-items:center;}
.tl-item .d{font-family:var(--mono);font-size:12px;color:var(--text-3);}
.tl-item .ty{font-weight:700;margin:5px 0 3px;}
.shared-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 13px;display:flex;gap:8px 12px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.shared-card .who{flex:1 1 200px;min-width:0;}
.warn-src{color:var(--amber);font-weight:600;font-size:11.5px;display:inline-flex;gap:4px;align-items:center;}

/* ---------- graph ---------- */
.graph-wrap{display:flex;flex:1;min-height:0;}
.graph-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.graph-bar{display:flex;gap:10px;align-items:center;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.graph-bar h2{font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--text-2);margin:0 8px 0 0;}
.graph-canvas{flex:1;position:relative;background-color:#FBFCFE;background-image:linear-gradient(#EDF0F5 1px,transparent 1px),linear-gradient(90deg,#EDF0F5 1px,transparent 1px);background-size:44px 44px;overflow:hidden;min-height:300px;}
.graph-canvas svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;}
.graph-canvas svg.panning{cursor:grabbing;}
.graph-hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--text-2);box-shadow:var(--shadow-sm);pointer-events:none;white-space:nowrap;}
.graph-legend{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:6px 14px;flex-wrap:wrap;background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:11.5px;color:var(--text-2);pointer-events:none;}
.graph-legend span{display:inline-flex;gap:5px;align-items:center;white-space:nowrap;}
.graph-zoom{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;}
.graph-side{width:330px;min-width:330px;border-left:1px solid var(--border);background:var(--surface);overflow:auto;}
.graph-side .card-b{font-size:12.5px;}
.gnode{cursor:pointer;}
.gnode text{font-size:12px;fill:var(--text-1);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none;}
.gnode text.ini{font-size:12px;font-weight:700;stroke:none;}
.glink-label{font-size:10.5px;fill:var(--text-2);paint-order:stroke;stroke:#FBFCFE;stroke-width:4px;pointer-events:none;}
.dimmed{opacity:.13;}
.path-chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 18px;background:var(--purple-bg);border-bottom:1px solid var(--border);font-size:12.5px;}
.path-chain .nd{background:#fff;border:1px solid #D6CCF2;border-radius:6px;padding:3px 8px;font-weight:600;}
.path-chain .ar{color:var(--purple);font-size:11.5px;}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start;}
.kcol{background:#EEF0F5;border-radius:var(--radius-lg);padding:10px;}
.kcol-h{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-2);}
.kcol-h .n{margin-left:auto;font-family:var(--mono);}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 12px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.kcard .id{font-family:var(--mono);font-size:11px;color:var(--text-3);}
.kcard .tt{font-weight:700;margin:3px 0 6px;}
.kcard .meta{font-size:11.5px;color:var(--text-3);margin-top:6px;}
.kcard .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}

/* ---------- matrix ---------- */
.matrix td.cell{text-align:center;}
.mcell{display:inline-block;width:26px;height:22px;border-radius:5px;line-height:22px;font-size:10.5px;font-weight:700;}
.mcell.toza{background:var(--green-bg);color:var(--green);}
.mcell.shubhali{background:var(--amber-bg);color:var(--amber);}
.mcell.salbiy{background:var(--red-bg);color:var(--red);}
.mcell.none{background:#F1F2F5;color:#B5BCC8;}

/* ---------- drawer / modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(11,18,32,.42);z-index:90;display:none;}
.overlay.open{display:block;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:var(--surface);z-index:95;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;}
.drawer.open{transform:none;}
.drawer-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border);}
.drawer-h h3{margin:0;font-size:15px;}
.drawer-b{flex:1;overflow:auto;padding:16px 18px;}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:620px;max-width:calc(100vw - 24px);max-height:calc(100vh - 40px);background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);z-index:100;display:none;flex-direction:column;}
.modal.open{display:flex;}
.modal-h{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--border);}
.modal-h h3{margin:0;font-size:15px;}
.modal-b{padding:16px 18px;overflow:auto;}
.modal-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface-alt);border-radius:0 0 12px 12px;}
.modal-f .preview{margin-right:auto;font-size:12.5px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12px;font-weight:600;color:var(--text-2);}
.field .req{color:var(--red);}
.field .hint{font-size:11.5px;color:var(--text-3);}
.field .errt{font-size:11.5px;color:var(--red);}
.radio-row{display:flex;gap:8px;flex-wrap:wrap;}
.radio-row label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:6px 11px;cursor:pointer;font-weight:500;color:var(--text-1);}
.radio-row label.on{border-color:var(--blue);background:var(--blue-bg);}
.check-list{display:flex;flex-wrap:wrap;gap:6px 14px;}
.check-list label{display:inline-flex;gap:6px;align-items:center;font-weight:500;color:var(--text-1);font-size:12.5px;}
.idp-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--border);}
.toasts{position:fixed;bottom:18px;right:18px;z-index:120;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy-1);color:#fff;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:12.5px;max-width:380px;display:flex;gap:10px;align-items:flex-start;animation:tin .2s;}
.toast.red{background:#7E1A15;}
@keyframes tin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.denied{max-width:520px;margin:60px auto;text-align:center;}
.denied .ic{width:56px;height:56px;border-radius:50%;background:var(--red-bg);color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}

/* ---------- report ---------- */
.report{max-width:860px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:38px 46px;box-shadow:var(--shadow-sm);}
.report h1{font-size:24px;margin:0 0 4px;}
.report h2{font-size:15px;margin:26px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--text-1);}
.report h3{font-size:13.5px;margin:16px 0 6px;}
.report table.t td,.report table.t th{padding:6px 8px;font-size:12px;}
.report .stamp{display:inline-block;border:2px solid var(--red);color:var(--red);font-weight:700;padding:3px 10px;border-radius:4px;font-size:11px;letter-spacing:1px;transform:rotate(-2deg);}

@media (max-width:1180px){
  .kpi-strip{grid-template-columns:repeat(3,1fr);}
  .g-main,.profile-head{grid-template-columns:1fr;}
  .graph-side{display:none;}
  .kanban{grid-template-columns:repeat(2,minmax(220px,1fr));}
}
@media (max-width:820px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.mobile-open{transform:none;}
  .search-box{width:auto;flex:1;}
  .topbar .pill.sample,.topbar .pill.date,.user-chip .nm,.user-chip .rl{display:none;}
  .content{padding:16px;}
  .g2,.g3{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .kanban{grid-template-columns:1fr;}
  .hide-sm{display:none;}
}
@media print{
  body{overflow:visible;background:#fff;}
  .sidebar,.topbar,.no-print,.toasts{display:none !important;}
  .app-shell,.main-col{display:block;height:auto;}
  .content{overflow:visible;padding:0;}
  .report{border:none;box-shadow:none;padding:0;max-width:none;}
}
</style>
</head>
